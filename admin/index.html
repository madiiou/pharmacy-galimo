<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://pharmacy.galimo.tech/" />
    <meta name="theme-color" content="#3D1A8F" />

    <title>Galimo Pharmacie — Commande de médicaments en ligne à Conakry</title>
    <meta
      name="description"
      content="Galimo Pharmacie : commandez vos médicaments en ligne à Conakry, avec retrait ou livraison et paiement sécurisé via Galimo. Première pharmacie partenaire : Pharmacie Saoudatou (Lambanyi)."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph : surtout pour un aperçu correct quand un lien est partagé
         sur WhatsApp, Facebook, etc. — canal de partage principal ici. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Galimo Pharmacie" />
    <meta property="og:title" content="Galimo Pharmacie — Commande de médicaments en ligne à Conakry" />
    <meta
      property="og:description"
      content="Galimo Pharmacie : commandez vos médicaments en ligne à Conakry, avec retrait ou livraison et paiement sécurisé via Galimo. Première pharmacie partenaire : Pharmacie Saoudatou (Lambanyi)."
    />
    <meta property="og:url" content="https://pharmacy.galimo.tech/" />
    <meta property="og:locale" content="fr_GN" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Galimo Pharmacie — Commande de médicaments en ligne à Conakry" />
    <meta
      name="twitter:description"
      content="Galimo Pharmacie : commandez vos médicaments en ligne à Conakry, avec retrait ou livraison et paiement sécurisé via Galimo."
    />

    <!-- Données structurées : Galimo Pharmacie est la plateforme (marque
         "brand"/organisation mère) ; l'entité "Pharmacy" décrite ici est sa
         première pharmacie partenaire, celle actuellement affichée sur le
         site. À régénérer si l'adresse/les horaires changent, ou à rendre
         dynamique (une entité par pharmacie) le jour où plusieurs pharmacies
         partenaires cohabitent sur le site. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Pharmacy",
        "name": "Pharmacie Saoudatou",
        "url": "https://pharmacy.galimo.tech/",
        "telephone": "+224625670409",
        "brand": {
          "@type": "Organization",
          "name": "Galimo Pharmacie",
          "url": "https://pharmacy.galimo.tech/"
        },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Lambanyi",
          "addressLocality": "Conakry",
          "addressCountry": "GN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "20:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "18:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "10:00",
            "closes": "13:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
