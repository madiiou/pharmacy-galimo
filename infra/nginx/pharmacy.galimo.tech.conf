server {
    listen 80;
    server_name pharmacy.galimo.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pharmacy.galimo.tech;

    ssl_certificate     /etc/letsencrypt/live/pharmacy.galimo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pharmacy.galimo.tech/privkey.pem;

    # API + WebSocket (Socket.IO) -> conteneur Node
    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Dashboard admin/partenaire (build statique React)
    root /var/www/pharmacy-admin;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
